services:
  - type: web
    name: forge-fitness
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn fitness_backend_api_v2_connected:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: FORGE_PERSISTENCE_KEY
        value: forge-production
      - key: FORGE_DEPLOYMENT
        value: render
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: FORGE_LLM_ENABLED
        value: "1"
      - key: FORGE_LLM_MODEL
        value: gpt-4o-mini
      - key: FORGE_LLM_TIMEOUT
        value: "30"
      - key: NUTRITION_LOOKUP_ENABLED
        value: "1"
      - key: OPENFOODFACTS_ENABLED
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: FDC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FORGE_APP_URL
        sync: false
