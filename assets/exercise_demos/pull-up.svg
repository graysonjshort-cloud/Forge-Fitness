<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-label="Pull-Up articulated form demonstration">
<rect width="420" height="420" rx="30" fill="#0d1217"/>
<circle cx="210" cy="190" r="158" fill="none" stroke="#202a34" stroke-width="2"/>

<path d="M70 55 H350" stroke="#ef233c" stroke-width="10" stroke-linecap="round"/>
<path d="M95 55 V95 M325 55 V95" stroke="#3a444e" stroke-width="7"/>
<!-- body with articulated elbows -->
<circle cx="210" cy="150" r="22" fill="#1b232a" stroke="#eef2f5" stroke-width="5">
 <animate attributeName="cy" values="150;98;98;150" dur="3s" repeatCount="indefinite"/>
</circle>
<line x1="210" y1="174" x2="210" y2="250" stroke="#eef2f5" stroke-width="15" stroke-linecap="round">
 <animate attributeName="y1" values="174;122;122;174" dur="3s" repeatCount="indefinite"/>
 <animate attributeName="y2" values="250;198;198;250" dur="3s" repeatCount="indefinite"/>
</line>
<!-- upper arms -->
<line x1="210" y1="185" x2="155" y2="118" stroke="#eef2f5" stroke-width="13" stroke-linecap="round">
 <animate attributeName="y1" values="185;133;133;185" dur="3s" repeatCount="indefinite"/>
 <animate attributeName="x2" values="155;148;148;155" dur="3s" repeatCount="indefinite"/>
 <animate attributeName="y2" values="118;93;93;118" dur="3s" repeatCount="indefinite"/>
</line>
<line x1="210" y1="185" x2="265" y2="118" stroke="#eef2f5" stroke-width="13" stroke-linecap="round">
 <animate attributeName="y1" values="185;133;133;185" dur="3s" repeatCount="indefinite"/>
 <animate attributeName="x2" values="265;272;272;265" dur="3s" repeatCount="indefinite"/>
 <animate attributeName="y2" values="118;93;93;118" dur="3s" repeatCount="indefinite"/>
</line>
<!-- forearms to bar -->
<line x1="155" y1="118" x2="135" y2="60" stroke="#eef2f5" stroke-width="11" stroke-linecap="round">
 <animate attributeName="x1" values="155;148;148;155" dur="3s" repeatCount="indefinite"/>
 <animate attributeName="y1" values="118;93;93;118" dur="3s" repeatCount="indefinite"/>
</line>
<line x1="265" y1="118" x2="285" y2="60" stroke="#eef2f5" stroke-width="11" stroke-linecap="round">
 <animate attributeName="x1" values="265;272;272;265" dur="3s" repeatCount="indefinite"/>
 <animate attributeName="y1" values="118;93;93;118" dur="3s" repeatCount="indefinite"/>
</line>
<!-- legs -->
<line x1="210" y1="250" x2="180" y2="320" stroke="#eef2f5" stroke-width="13" stroke-linecap="round">
 <animate attributeName="y1" values="250;198;198;250" dur="3s" repeatCount="indefinite"/>
 <animate attributeName="y2" values="320;268;268;320" dur="3s" repeatCount="indefinite"/>
</line>
<line x1="210" y1="250" x2="240" y2="320" stroke="#eef2f5" stroke-width="13" stroke-linecap="round">
 <animate attributeName="y1" values="250;198;198;250" dur="3s" repeatCount="indefinite"/>
 <animate attributeName="y2" values="320;268;268;320" dur="3s" repeatCount="indefinite"/>
</line>
<path d="M210 151 V95" stroke="#ef233c" stroke-width="3" stroke-dasharray="7 7" opacity=".45"/>
<text x="210" y="356" text-anchor="middle" fill="#9eabb6" font-family="system-ui,sans-serif" font-size="11">Drive elbows down • minimize swinging • control the descent</text>

<text x="210" y="386" text-anchor="middle" fill="#f1f4f7" font-family="system-ui,sans-serif" font-size="15" font-weight="800">Pull-Up</text>
<text x="210" y="405" text-anchor="middle" fill="#7f8b96" font-family="system-ui,sans-serif" font-size="10">ARTICULATED FORM DEMO • V2</text>
</svg>